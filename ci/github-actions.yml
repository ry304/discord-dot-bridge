# Copy to .github/workflows/test.yml using an account with workflow permission.
name: Synthetic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python scripts/prepublish_check.py
      - run: python -m tests
      - run: python -m integration
      - run: python -m bridge demo
      - run: docker build -t bridge-test .
      - run: docker run --rm --network none --read-only --tmpfs /tmp bridge-test python -m integration
